spring.application.name=auth
server.port=4004

spring.datasource.url=jdbc:mysql://localhost:3310/auth_db
spring.datasource.username=auth_user
spring.datasource.password=auth_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.private-key-path=keys/private_key.pem
security.jwt.public-key-path=keys/public_key.pem
security.jwt.issuer=ms-auth
security.jwt.access-token-minutes=30